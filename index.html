<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarChess - Phase 1</title>
  <style>
    /* Basic reset and centering */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eaeaea;
    }
    /* Responsive canvas container */
    canvas {
      max-width: 500px;
      max-height: 800px;
      width: 90vw;
      height: auto;
      touch-action: manipulation;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <canvas id="chessCanvas"></canvas>
  <script>
    // Global variables
    const canvas = document.getElementById('chessCanvas');
    const ctx = canvas.getContext('2d');
    let board = []; // 8x8 board: each cell is either null or a piece object { type, color, hasMoved }
    let selectedPiece = null; // { row, col }
    let currentPlayer = "white";
    let squareSize = 0; // computed dynamically

    // Colors for board squares
    const lightSquareColor = "#f0f0f0";
    const darkSquareColor  = "#666666";

    // Resize and initialize canvas to be square based on available width (max 500px)
    function resizeCanvas() {
      // Use the smaller of the window's width and max-width (500)
      const size = Math.min(window.innerWidth * 0.9, 500);
      canvas.width = size;
      canvas.height = size;
      squareSize = canvas.width / 8;
      drawGame();
    }
    window.addEventListener('resize', resizeCanvas);
    
    // Initialize board state with standard chess starting positions
    function initializeBoard() {
      board = [];
      for (let r = 0; r < 8; r++) {
        board[r] = new Array(8).fill(null);
      }
      // Helper to create a piece
      function createPiece(type, color) {
        return { type: type, color: color, hasMoved: false };
      }
      // Setup black pieces (rows 0 & 1)
      board[0][0] = createPiece("rook", "black");
      board[0][1] = createPiece("knight", "black");
      board[0][2] = createPiece("bishop", "black");
      board[0][3] = createPiece("queen", "black");
      board[0][4] = createPiece("king", "black");
      board[0][5] = createPiece("bishop", "black");
      board[0][6] = createPiece("knight", "black");
      board[0][7] = createPiece("rook", "black");
      for (let c = 0; c < 8; c++) {
        board[1][c] = createPiece("pawn", "black");
      }
      // Setup white pieces (rows 6 & 7)
      for (let c = 0; c < 8; c++) {
        board[6][c] = createPiece("pawn", "white");
      }
      board[7][0] = createPiece("rook", "white");
      board[7][1] = createPiece("knight", "white");
      board[7][2] = createPiece("bishop", "white");
      board[7][3] = createPiece("queen", "white");
      board[7][4] = createPiece("king", "white");
      board[7][5] = createPiece("bishop", "white");
      board[7][6] = createPiece("knight", "white");
      board[7][7] = createPiece("rook", "white");
    }

    // Draw the entire game: board, pieces, and highlight selected piece.
    function drawGame() {
      drawBoard();
      drawPieces();
      if (selectedPiece) {
        highlightSquare(selectedPiece.row, selectedPiece.col, "rgba(255,255,0,0.4)");
      }
    }

    // Draw the chess board (8x8 grid with alternating colors)
    function drawBoard() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const x = col * squareSize;
          const y = row * squareSize;
          // Use alternating colors: if (row+col) is even use light color; else dark.
          ctx.fillStyle = ((row + col) % 2 === 0) ? lightSquareColor : darkSquareColor;
          ctx.fillRect(x, y, squareSize, squareSize);
        }
      }
    }

    // Highlight a square (used for selection)
    function highlightSquare(row, col, color) {
      ctx.fillStyle = color;
      ctx.fillRect(col * squareSize, row * squareSize, squareSize, squareSize);
      // Redraw border for clarity
      ctx.strokeStyle = "#ff0";
      ctx.lineWidth = 3;
      ctx.strokeRect(col * squareSize, row * squareSize, squareSize, squareSize);
    }

    // Draw all pieces on the board
    function drawPieces() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          if (piece) {
            drawPiece(piece, col * squareSize, row * squareSize, squareSize);
          }
        }
      }
    }

    // Draw a single piece with basic geometric design
    function drawPiece(piece, x, y, size) {
      const centerX = x + size / 2;
      const centerY = y + size / 2;
      // Set styles based on piece color
      if (piece.color === "white") {
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#000";
      } else {
        ctx.fillStyle = "#000";
        ctx.strokeStyle = "#fff";
      }
      ctx.lineWidth = 2;

      switch(piece.type) {
        case "pawn":
          // Draw a circle
          ctx.beginPath();
          ctx.arc(centerX, centerY, size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          break;
        case "rook":
          // Draw a rectangle
          ctx.beginPath();
          ctx.rect(x + size * 0.2, y + size * 0.2, size * 0.6, size * 0.6);
          ctx.fill();
          ctx.stroke();
          break;
        case "knight":
          // Draw a simple triangle for the knight
          ctx.beginPath();
          ctx.moveTo(centerX, y + size * 0.2);
          ctx.lineTo(x + size * 0.2, y + size * 0.8);
          ctx.lineTo(x + size * 0.8, y + size * 0.8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
        case "bishop":
          // Draw a diamond shape
          ctx.beginPath();
          ctx.moveTo(centerX, y + size * 0.2);
          ctx.lineTo(x + size * 0.2, centerY);
          ctx.lineTo(centerX, y + size * 0.8);
          ctx.lineTo(x + size * 0.8, centerY);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
        case "queen":
          // Draw a circle with a simple crown (three small circles on top)
          ctx.beginPath();
          ctx.arc(centerX, centerY, size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // Crown circles
          const crownRadius = size * 0.08;
          ctx.beginPath();
          ctx.arc(x + size * 0.3, y + size * 0.2, crownRadius, 0, Math.PI * 2);
          ctx.arc(centerX, y + size * 0.15, crownRadius, 0, Math.PI * 2);
          ctx.arc(x + size * 0.7, y + size * 0.2, crownRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          break;
        case "king":
          // Draw a circle with a cross
          ctx.beginPath();
          ctx.arc(centerX, centerY, size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // Draw the cross
          ctx.beginPath();
          ctx.moveTo(centerX, centerY - size * 0.25);
          ctx.lineTo(centerX, centerY + size * 0.25);
          ctx.moveTo(centerX - size * 0.25, centerY);
          ctx.lineTo(centerX + size * 0.25, centerY);
          ctx.stroke();
          break;
      }
    }

    // Utility: check if given row and col are within board boundaries
    function isInsideBoard(row, col) {
      return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    // Get all valid moves for a piece at (row, col) using basic chess rules
    function getValidMoves(row, col) {
      const moves = [];
      const piece = board[row][col];
      if (!piece) return moves;

      const forward = (piece.color === "white") ? -1 : 1; // white moves upward, black downward

      switch(piece.type) {
        case "pawn":
          // One square forward if empty
          if (isInsideBoard(row + forward, col) && !board[row + forward][col]) {
            moves.push({ row: row + forward, col: col });
            // Two squares forward if on starting row and both squares are empty
            const startingRow = (piece.color === "white") ? 6 : 1;
            if (row === startingRow && !board[row + 2 * forward][col]) {
              moves.push({ row: row + 2 * forward, col: col });
            }
          }
          // Diagonal captures
          for (let dCol of [-1, 1]) {
            const newRow = row + forward;
            const newCol = col + dCol;
            if (isInsideBoard(newRow, newCol) && board[newRow][newCol] && board[newRow][newCol].color !== piece.color) {
              moves.push({ row: newRow, col: newCol });
            }
          }
          break;
        case "knight":
          // All 8 possible L-shaped moves
          const knightMoves = [
            { dr: -2, dc: -1 }, { dr: -2, dc: 1 },
            { dr: -1, dc: -2 }, { dr: -1, dc: 2 },
            { dr: 1, dc: -2 }, { dr: 1, dc: 2 },
            { dr: 2, dc: -1 }, { dr: 2, dc: 1 }
          ];
          knightMoves.forEach(move => {
            const newRow = row + move.dr, newCol = col + move.dc;
            if (isInsideBoard(newRow, newCol) && (!board[newRow][newCol] || board[newRow][newCol].color !== piece.color)) {
              moves.push({ row: newRow, col: newCol });
            }
          });
          break;
        case "bishop":
          // Diagonals in 4 directions
          [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(direction => {
            let r = row + direction[0], c = col + direction[1];
            while (isInsideBoard(r, c)) {
              if (board[r][c]) {
                if (board[r][c].color !== piece.color) moves.push({ row: r, col: c });
                break;
              }
              moves.push({ row: r, col: c });
              r += direction[0];
              c += direction[1];
            }
          });
          break;
        case "rook":
          // Horizontal and vertical directions
          [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(direction => {
            let r = row + direction[0], c = col + direction[1];
            while (isInsideBoard(r, c)) {
              if (board[r][c]) {
                if (board[r][c].color !== piece.color) moves.push({ row: r, col: c });
                break;
              }
              moves.push({ row: r, col: c });
              r += direction[0];
              c += direction[1];
            }
          });
          break;
        case "queen":
          // Combine bishop and rook moves
          moves.push(...getValidMovesForType("rook", row, col));
          moves.push(...getValidMovesForType("bishop", row, col));
          break;
        case "king":
          // One square in any direction
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const newRow = row + dr, newCol = col + dc;
              if (isInsideBoard(newRow, newCol) && (!board[newRow][newCol] || board[newRow][newCol].color !== piece.color)) {
                moves.push({ row: newRow, col: newCol });
              }
            }
          }
          break;
      }
      return moves;
    }

    // Helper for queen moves: reuse rook and bishop moves
    function getValidMovesForType(type, row, col) {
      const tempPiece = { type: type, color: board[row][col].color };
      // Temporarily replace the piece type and compute moves
      const originalType = board[row][col].type;
      board[row][col].type = type;
      const moves = getValidMoves(row, col);
      board[row][col].type = originalType;
      return moves;
    }

    // Attempt to move a piece from (fromRow, fromCol) to (toRow, toCol)
    function tryMove(fromRow, fromCol, toRow, toCol) {
      const piece = board[fromRow][fromCol];
      if (!piece) return false;
      const validMoves = getValidMoves(fromRow, fromCol);
      // Check if the target square is in the list of valid moves
      if (validMoves.some(move => move.row === toRow && move.col === toCol)) {
        // If there is an enemy piece, capture it
        board[toRow][toCol] = piece;
        board[fromRow][fromCol] = null;
        piece.hasMoved = true;
        // Switch turn
        currentPlayer = (currentPlayer === "white") ? "black" : "white";
        return true;
      }
      return false;
    }

    // Convert canvas coordinates to board row and column
    function getSquareFromCoordinates(x, y) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const canvasX = (x - rect.left) * scaleX;
      const canvasY = (y - rect.top) * scaleY;
      const col = Math.floor(canvasX / squareSize);
      const row = Math.floor(canvasY / squareSize);
      return { row, col };
    }

    // Handle user input (click or touch)
    function handleInput(x, y) {
      const { row, col } = getSquareFromCoordinates(x, y);
      if (!isInsideBoard(row, col)) return;
      
      const clickedPiece = board[row][col];
      
      if (selectedPiece) {
        // If the same square is clicked, deselect.
        if (selectedPiece.row === row && selectedPiece.col === col) {
          selectedPiece = null;
        } else {
          // Attempt to move the selected piece
          if (tryMove(selectedPiece.row, selectedPiece.col, row, col)) {
            selectedPiece = null;
          } else {
            // If move is invalid but clicked on own piece, change selection.
            if (clickedPiece && clickedPiece.color === currentPlayer) {
              selectedPiece = { row, col };
            } else {
              // Otherwise, leave the selection as is.
            }
          }
        }
      } else {
        // No piece currently selected. If clicked square has a piece of current player, select it.
        if (clickedPiece && clickedPiece.color === currentPlayer) {
          selectedPiece = { row, col };
        }
      }
      drawGame();
    }

    // Event listeners for mouse and touch input
    canvas.addEventListener('mousedown', function(e) {
      handleInput(e.clientX, e.clientY);
    });
    canvas.addEventListener('touchstart', function(e) {
      const touch = e.touches[0];
      handleInput(touch.clientX, touch.clientY);
      // Prevent default to avoid additional emulated mouse events
      e.preventDefault();
    }, { passive: false });

    // Initialize everything on load
    window.onload = function() {
      initializeBoard();
      resizeCanvas();
    };
  </script>
</body>
</html>
